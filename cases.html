<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Files - AI Justice Matrix</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div id="preloader"><div class="preloader-icon">⚖️</div></div>
    <div class="background-grid"></div>
    <div class="cursor-light"></div>

    <header class="navbar"></header>

    <main class="page-content">
        <section class="content-section">
            <h1 class="page-title" data-scroll-reveal>Case File Database</h1>
            
            <div class="datagrid-container" data-scroll-reveal>
                <div class="datagrid-controls">
                    <input type="text" id="searchInput" placeholder="Search cases by name or ID...">
                </div>
                
                <table class="datagrid">
                    <thead>
                        <tr>
                            <th data-sort="id">Case ID</th>
                            <th data-sort="name">Defendant Name</th>
                            <th data-sort="date">Date Filed</th>
                            <th data-sort="status">Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="caseTableBody">
                        </tbody>
                </table>
                
                <div class="datagrid-pagination">
                    </div>
            </div>
        </section>
    </main>

    <div id="caseModal" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <div id="modalBody">
                </div>
        </div>
    </div>
    
    <footer class="footer"></footer>
    <script src="assets/js/script.js"></script>
</body>
</html>
