<!DOCTYPE html>
<html lang="en">
<head>
    <title>Recommendations - AI Justice Matrix</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="preloader"></div>
    <div class="background-grid"></div>
    <div class="cursor-light"></div>
    <header class="navbar"></header>

    <main class="page-content">
        <section class="content-section">
            <h1 class="page-title" data-scroll-reveal>AI Recommendations</h1>
            <div class="filter-controls" data-scroll-reveal>
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="recommended">Recommended</button>
                <button class="filter-btn" data-filter="denied">Denied</button>
                <button class="filter-btn" data-filter="pending">Pending Review</button>
            </div>
            <div class="recommendations-grid" id="recommendationsGrid">
                </div>
        </section>
    </main>

    <footer class="footer"></footer>
    <script src="script.js"></script>
</body>
</html>
