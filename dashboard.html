<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - AI Justice Matrix</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div id="preloader"><div class="preloader-icon">⚖️</div></div>
    <div class="background-grid"></div>
    <div class="cursor-light"></div>

    <header class="navbar"></header>

    <main class="page-content">
        <section class="content-section">
            <h1 class="page-title" data-scroll-reveal>System Dashboard</h1>
            <div class="dashboard-grid">
                
                <div class="dashboard-card status-card" data-scroll-reveal>
                    <h4>System Status</h4>
                    <div class="status-indicator">
                        <div class="status-light"></div>
                        <p>All Systems Operational</p>
                    </div>
                    <p class="status-update">Last Check: Just Now</p>
                </div>

                <div class="dashboard-card" data-scroll-reveal>
                    <h4>Cases Processed (7 Days)</h4>
                    <canvas id="casesChart"></canvas>
                </div>

                <div class="dashboard-card large-card" data-scroll-reveal>
                    <h4>Recommendation Distribution</h4>
                    <canvas id="distributionChart"></canvas>
                </div>
                
                <div class="dashboard-card" data-scroll-reveal>
                    <h4>Risk Factor Analysis</h4>
                    <canvas id="riskFactorChart"></canvas>
                </div>

                <div class="dashboard-card activity-card" data-scroll-reveal>
                    <h4>Live Activity Log</h4>
                    <ul class="activity-log">
                        </ul>
                </div>
            </div>
        </section>
    </main>
    
    <footer class="footer"></footer>
    <script src="assets/js/script.js"></script>
</body>
</html>
